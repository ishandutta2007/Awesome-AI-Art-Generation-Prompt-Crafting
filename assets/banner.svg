<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.75; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-12px) scale(1.2); opacity: 0.85; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 250px 180px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite alternate;
      transform-origin: 950px 220px;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashMove 5s linear infinite;
    }
    .rotating-ring {
      transform-origin: 600px 210px;
      animation: rotateRing 30s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmosphere in Background -->
  <g filter="url(#blurFilter)">
    <circle cx="220" cy="160" r="180" fill="url(#glowPurple)" class="orb-1" />
    <circle cx="980" cy="220" r="210" fill="url(#glowCyan)" class="orb-2" />
    <circle cx="600" cy="320" r="150" fill="url(#glowPink)" class="orb-1" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Geometry / Generative Canvas Accents (Kept subtle and in background) -->
  <g opacity="0.25">
    <circle cx="600" cy="210" r="260" fill="none" stroke="#6366f1" stroke-width="1.5" class="flow-line" />
    <circle cx="600" cy="210" r="330" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="12 12" class="rotating-ring" />
    <path d="M 100 210 Q 350 120 600 210 T 1100 210" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    <path d="M 100 250 Q 350 340 600 250 T 1100 250" fill="none" stroke="#c084fc" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Ambient Floating Nodes / Sparks -->
  <g>
    <circle cx="160" cy="90" r="3" fill="#38bdf8" class="particle" style="animation-delay: 0s;" />
    <circle cx="340" cy="330" r="2.5" fill="#a78bfa" class="particle" style="animation-delay: 1s;" />
    <circle cx="860" cy="80" r="3" fill="#f472b6" class="particle" style="animation-delay: 2s;" />
    <circle cx="1060" cy="310" r="3.5" fill="#38bdf8" class="particle" style="animation-delay: 0.5s;" />
    <circle cx="600" cy="60" r="2" fill="#e0e7ff" class="particle" style="animation-delay: 1.5s;" />
  </g>

  <!-- Central Foreground Content (Unobscured & Crystal Clear) -->
  <g transform="translate(600, 150)">
    <!-- Main Headline Badge -->
    <rect x="-160" y="-85" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="-135" cy="-69" r="5" fill="#10b981" />
    <text x="-118" y="-64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="-12" text-anchor="middle" font-size="46" fill="url(#titleGrad)" class="title-text">
      AI Art Generation &amp; Prompt Crafting
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="32" text-anchor="middle" font-size="19" fill="url(#subGrad)" class="sub-text">
      Diffusion Models • Local Node UIs • Generative SaaS • Prompt Engineering
    </text>

    <!-- Interactive / Feature Ecosystem Badges -->
    <g transform="translate(0, 95)">
      <!-- Pill 1: ComfyUI & Forge -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e1e2f" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2" />
        <circle cx="20" cy="19" r="6" fill="#6366f1" />
        <text x="35" y="24" class="pill-text">ComfyUI &amp; Forge</text>
      </g>

      <!-- Pill 2: FLUX & SD 3.5 -->
      <g transform="translate(-175, 0)">
        <rect x="0" y="0" width="160" height="38" rx="19" fill="#1e1e2f" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.2" />
        <circle cx="20" cy="19" r="6" fill="#8b5cf6" />
        <text x="35" y="24" class="pill-text">FLUX &amp; SD 3.5</text>
      </g>

      <!-- Pill 3: ControlNet & LoRA -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="170" height="38" rx="19" fill="#1e1e2f" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
        <circle cx="20" cy="19" r="6" fill="#ec4899" />
        <text x="35" y="24" class="pill-text">ControlNet &amp; LoRA</text>
      </g>

      <!-- Pill 4: Prompt Engineering -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="180" height="38" rx="19" fill="#1e1e2f" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.2" />
        <circle cx="20" cy="19" r="6" fill="#06b6d4" />
        <text x="35" y="24" class="pill-text">Prompt Engineering</text>
      </g>
    </g>
  </g>

  <!-- Modern Accent Border -->
  <rect x="1" y="1" width="1198" height="418" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
